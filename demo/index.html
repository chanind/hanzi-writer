<!DOCTYPE html>
<html lang="en-us">
	<head>
		<meta charset="utf-8">
		<title>Hanzi Writer</title>
		<!-- <link href='http://fonts.googleapis.com/css?family=Raleway' rel='stylesheet' type='text/css'> -->
		<link rel="stylesheet" href="styles.css" />
		<script src="https://cdn.polyfill.io/v2/polyfill.min.js"></script>
	</head>
	<body>

		<h1 class="title">Hanzi Writer</h1>
		<form class="js-char-form char-form">
			<label>
				Character
				<input type="text" class="js-char char-input" size="1" maxlength="1" value="我" />
			</label>
			<button type="submit">Update</button>
		</form>
		<div class="actions">
			<button class="js-toggle">Show/hide</button>
			<button class="js-toggle-hint">Outline on/off</button>
			<button class="js-animate">Animate</button>
			<button class="js-quiz">Quiz yourself</button>
		</div>

		<div class="enhanced-controls" style="margin: 20px 0; padding: 15px; background: #f5f5f5; border-radius: 8px;">
			<h3 style="margin: 0 0 10px 0;">Enhanced Drawing Options</h3>
			<label style="display: inline-flex; align-items: center; margin-right: 20px; cursor: pointer;">
				<input type="checkbox" class="js-enhanced-drawing" style="margin-right: 8px;" />
				<span>Enable Enhanced Drawing</span>
			</label>
			<div style="margin-top: 10px;">
				<label style="display: inline-block; width: 200px; margin-right: 15px;">
					Line Width Range: <span class="js-width-range-val">0.5x - 1.5x</span>
					<br/>
					<input type="range" class="js-width-range" min="0.2" max="0.8" step="0.1" value="0.5" style="width: 180px; margin-top: 5px;" />
				</label>
				<label style="display: inline-block; width: 200px;">
					Speed Sensitivity: <span class="js-speed-val">0.5</span>
					<br/>
					<input type="range" class="js-speed" min="0.1" max="1.0" step="0.1" value="0.5" style="width: 180px; margin-top: 5px;" />
				</label>
			</div>
		</div>

		<div id="target">

		</div>

		<!-- <script src="https://cdn.polyfill.io/v2/polyfill.min.js"></script> -->
		<script type="application/javascript" src="../dist/hanzi-writer.js"></script>
		<script type="application/javascript" src="test.js"></script>

	</body>
</html>
